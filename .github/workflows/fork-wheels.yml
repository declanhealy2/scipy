name: Fork wheels (manual)

# One-shot wheel builder for the PPoly-MLX fork rev. GitHub-hosted macOS
# runners ship full Xcode plus brew gcc (gfortran), which a local CLT-only
# machine lacks. Mirrors the flags in the radar repo's pyproject
# ([tool.uv.extra-build-dependencies] + config-settings-package.scipy).
#
# Trigger: gh workflow run "Fork wheels (manual)" --repo declanhealy2/scipy --ref main

on:
  workflow_dispatch:
    inputs:
      rev:
        description: 'Scipy fork rev to build (full SHA)'
        required: true
        default: '098cb8408e7a0e2be93dd382e0ee1fc8e1c215f2'
      mlx_rev:
        description: 'MLX fork rev (must match the built _ppoly_mlx binding)'
        required: true
        default: 'c61f580c8f874eb201cca7cf4c02eb65c669157d'
      python-version:
        description: 'Python version'
        required: true
        default: '3.13'
      macos-target:
        description: 'MACOSX_DEPLOYMENT_TARGET'
        required: true
        default: '15.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rev }}
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build dependencies
        shell: bash
        run: |
          brew install gcc pkg-config openblas
          gfortran --version
          python -m pip install --upgrade pip build delocate cmake setuptools
          mkdir -p wheelhouse

      - name: Install MLX fork wheels (meson needs mlx importable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mlx-wheelhouse
          tag="wheels/$(printf '%s' '${{ inputs.mlx_rev }}' | cut -c1-7)"
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/declanhealy2/mlx/releases/tags/${tag}" |
            jq -r '.assets[].browser_download_url' |
            while read -r url; do
              # browser_download_url percent-encodes '+' as %2B; decode it
              # back so the saved file is a valid wheel filename again.
              name=$(python -c "import urllib.parse,sys; print(urllib.parse.unquote(sys.argv[1]))" "$(basename "$url")")
              curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
                -o "mlx-wheelhouse/${name}" "$url"
            done
          python -m pip install mlx-wheelhouse/*.whl
          python -c "import mlx.core as mx; print(mx.__version__, mx.metal.is_available())"

      - name: Build dependencies (Python)
        shell: bash
        run: |
          python -m pip install "meson-python>=0.15.0" "Cython>=3.2.0" \
            "pybind11>=2.13.2" "pythran>=0.18.1" "numpy>=2.0.0" nanobind ninja

      - name: Build scipy wheel (no isolation, ambient mlx+nanobind)
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ inputs.macos-target }}
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openblas)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          python -m build -w --no-isolation -Csetup-args=-Dppoly-mlx=true

      - name: Bundle external dylibs (libgfortran, openblas)
        shell: bash
        run: |
          delocate-wheel -w wheelhouse -v dist/scipy-*.whl
          # _ppoly_mlx must use the installed mlx's libmlx (meson rpath
          # ../../mlx/lib), NOT a bundled copy: two libmlx runtimes in one
          # process breaks cross-library Primitive dispatch, surfacing as
          # "Failed to load the default metallib" at eval time.
          zip -d wheelhouse/scipy-*.whl 'scipy/.dylibs/libmlx.dylib'
          for WHEEL in wheelhouse/*.whl; do unzip -l "$WHEEL" | head -6; echo; done

      - name: Verify wheel (install + fork parity tests)
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps wheelhouse/scipy-*.whl
          python -m pip install pytest
          otool -L "$(python -c "import scipy.interpolate._ppoly_mlx as m, pathlib; print(pathlib.Path(m.__file__))")" | grep -i mlx
          python -m pytest --no-header -q "$(python -c "import scipy, pathlib; print(pathlib.Path(scipy.__file__).parent / 'interpolate/tests/test_ppoly_native.py')")"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: scipy-fork-macos-py${{ inputs.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
