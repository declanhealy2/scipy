name: Apply window dtype refinement

on:
  push:
    branches:
      - signal-window-dtype
    paths:
      - .github/refine_window_dtype.py
      - .github/workflows/refine-window-dtype.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signal-window-dtype
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply refinement
        run: python .github/refine_window_dtype.py
      - name: Check syntax and whitespace
        run: |
          python -m py_compile \
            scipy/signal/windows/_windows.py \
            scipy/signal/tests/test_windows_dtype.py
          git diff --check
      - name: Commit refinement
        run: |
          rm .github/refine_window_dtype.py
          rm .github/workflows/refine-window-dtype.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ENH: validate signal window output dtype"
          git push origin HEAD:signal-window-dtype
